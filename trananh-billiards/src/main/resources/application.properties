spring.application.name=trananh-billiards

# Port 8080 is used by Apache on this machine. SERVER_PORT can override this.
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:2706/trananh_billiards}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Run database scripts explicitly; never seed or change an existing DB on startup.
spring.sql.init.mode=never
